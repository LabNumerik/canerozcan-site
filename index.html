<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caner Ozcan</title>
<meta name="description" content="Hi, I'm Caner. I make things glow on screens, walls and the occasional stage.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F1F4F6;
    --ink: #18202C;
    --soft: #4E5967;
    --glow: #F5B83D;
    --link-hover: #0B6E85;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  a { color: inherit; }
  a:hover { color: var(--link-hover); }
  a:focus-visible { outline: 2px solid var(--link-hover); outline-offset: 4px; border-radius: 2px; }

  .page {
    min-height: 100svh;
    width: min(1280px, 100% - 32px);
    margin-inline: auto;
    padding: clamp(24px, 5vh, 48px) 0 clamp(32px, 7vh, 64px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 64px;
  }
  @media (min-width: 720px) {
    .page { width: min(1280px, 100% - 160px); }
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    font-size: 17px;
  }
  .name { font-weight: 700; }
  .hello { text-decoration: none; font-weight: 500; }

  .intro { display: flex; flex-direction: column; gap: clamp(28px, 4vh, 40px); }
  h1 {
    margin: 0;
    max-width: 22ch;
    font-size: clamp(36px, 4.4vw, 64px);
    line-height: 1.1;
    font-weight: 500;
    letter-spacing: -0.03em;
  }
  .line {
    height: 3px;
    border-radius: 3px;
    background: var(--glow);
    box-shadow: 0 0 18px 3px color-mix(in srgb, var(--glow) 50%, transparent);
    transform-origin: left center;
    animation: switch-on 1.4s cubic-bezier(.2,.7,.2,1) .2s both;
  }
  @keyframes switch-on {
    from { transform: scaleX(0); opacity: 0; }
    to { transform: scaleX(1); opacity: 1; }
  }
  .meta {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px 48px;
    font-size: clamp(17px, 1.4vw, 19px);
    line-height: 1.5;
    color: var(--soft);
  }
  .meta p { margin: 0; }
  .work { max-width: 52ch; }
  .time { white-space: nowrap; font-variant-numeric: tabular-nums; }

  @media (prefers-reduced-motion: reduce) {
    .line { animation: none; }
  }
</style>
</head>
<body>
<main class="page">
  <header>
    <span class="name">Caner Ozcan</span>
    <a class="hello" href="mailto:info@canerozcan.de">Say hello</a>
  </header>
  <section class="intro">
    <h1>Hi, I'm Caner. I make things glow on screens, walls and the occasional stage.</h1>
    <div class="line" aria-hidden="true"></div>
    <div class="meta">
      <p class="work">I love juggling schedules, pixels and people, and somehow getting it all to come together (most of the time).</p>
      <p class="time">It's <span id="clock">--:--</span> here (<span id="zone">CET</span>)</p>
    </div>
  </section>
</main>
<script>
(function () {
  var clock = document.getElementById('clock');
  var zone = document.getElementById('zone');
  function tick() {
    var now = new Date();
    clock.textContent = now.toLocaleTimeString('en-GB', { timeZone: 'Europe/Berlin', hour: '2-digit', minute: '2-digit' });
    var parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Berlin', timeZoneName: 'short' }).formatToParts(now);
    var tz = parts.find(function (p) { return p.type === 'timeZoneName'; });
    zone.textContent = tz && /^CES?T$/.test(tz.value) ? tz.value : (tz && tz.value === 'GMT+2' ? 'CEST' : 'CET');
  }
  tick();
  setInterval(tick, 30000);
})();
</script>
</body>
</html>
